<style>
/* Layout: cena 3D fixa e clara, em névoa e neve. O retrato do Victor vira uma escultura de 3.694 blocos com profundidade real: cai do céu, respira em ondas e acompanha o ponteiro. Ao rolar, o rosto vira um redemoinho de blocos que monta cada projeto e, no fim, volta a ser o rosto. Texto editorial à esquerda. Visual claro único, monocromático, com um acento brasa. */
:root {
  --fog: #d4d8dc;
  --ink: #111418;
  --ink-2: #4a525b;
  --ink-3: #7c858f;
  --line: rgba(17, 20, 24, .14);
  --ember: #ff6b2c;
  --serif: "Instrument Serif", "Times New Roman", serif;
  --sans: "Geist", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--fog); }
body { margin: 0; background: linear-gradient(#c3c8cd, var(--fog) 55%, #e4e7ea) fixed, var(--fog); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; }
::selection { background: var(--ink); color: #fff; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
#cena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; touch-action: pan-y; }
.no3d #cena { display: none; }
.trilho { height: 1100vh; position: relative; z-index: 1; }
.ui { position: fixed; inset: 0; z-index: 5; pointer-events: none; padding: calc(18px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); }
.ui a, .ui button { pointer-events: auto; }
.topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.marca { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 500; }
.marca i { width: 10px; height: 10px; background: var(--ink); display: block; }
.nav { display: flex; gap: 18px; align-items: center; }
.nav button { border: 0; background: none; font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink-2); cursor: pointer; padding: 4px 0; }
.nav button:hover { color: var(--ink); }
.contador { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.texto { position: absolute; left: max(22px, env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%); width: min(470px, calc(100vw - 44px)); display: grid; gap: 14px; transition: opacity .45s, transform .45s; }
.texto.troca { opacity: 0; transform: translateY(calc(-50% + 14px)); }
.texto .k { font-family: var(--mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); display: flex; gap: 12px; align-items: center; }
.texto .k b { font-weight: 500; color: var(--ink); }
.texto .k::after { content: ""; flex: 1; max-width: 80px; height: 1px; background: var(--line); }
.texto h1, .texto h2 { margin: 0; font-family: var(--serif); font-weight: 400; letter-spacing: -0.02em; line-height: .95; text-wrap: balance; }
.texto h1 { font-size: clamp(60px, 8vw, 116px); }
.texto h2 { font-size: clamp(44px, 5.6vw, 80px); }
.texto em { font-style: italic; color: var(--ink-2); }
.texto p { margin: 0; color: var(--ink-2); font-size: 16px; max-width: 42ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.tags span::before { content: "+ "; }
.tags .estado::before { content: ""; display: inline-block; width: 6px; height: 6px; background: var(--ember); margin-right: 6px; vertical-align: 1px; }
.acoes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 18px; border: 1px solid var(--ink); background: transparent; color: var(--ink); font: 500 13px var(--sans); text-decoration: none; cursor: pointer; transition: background .2s, color .2s; }
.btn:hover { background: var(--ink); color: #fff; }
.btn.cheio { background: var(--ink); color: #fff; }
.btn.cheio:hover { background: #2a3038; }
.email { font-family: var(--mono); font-size: 14px; user-select: all; overflow-wrap: anywhere; }
.base { position: absolute; left: max(22px, env(safe-area-inset-left, 0px)); right: max(22px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 16px; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.barra { flex: 1; height: 1px; background: var(--line); position: relative; }
.barra i { position: absolute; left: 0; top: -1px; height: 3px; width: 0; background: var(--ink); }
@media (max-width: 760px) {

  .texto.troca { transform: translateY(12px); }
  .texto::before { content: ""; position: absolute; inset: -40px -22px -60px; background: linear-gradient(transparent, rgba(220, 224, 228, .92) 30%); z-index: -1; }
  .texto h1 { font-size: 56px; }
  .texto h2 { font-size: 42px; }
  .texto p { font-size: 15px; }
  .nav .opt { display: none; }
}
@media (prefers-reduced-motion: reduce) { .texto { transition: none; } }

/* computadorzinho que segue o mouse */
.pc, .rastro { display: none; }
@media (hover: hover) and (pointer: fine) {
  html.com-pc, html.com-pc * { cursor: none !important; }
  .pc { display: block; position: fixed; left: 0; top: 0; z-index: 50; width: 46px; height: 46px; margin: -6px 0 0 -6px; pointer-events: none; transform-origin: 23px 40px; will-change: transform; }
  .pc .corpo { transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); transform-origin: 23px 40px; }
  .pc.sobre .corpo { transform: scale(1.3); }
  .pc.clique .corpo { transform: scale(.86); }
  .pc .rosto, .pc .seta, .pc .alerta, .pc .digita { transition: opacity .15s; }
  .pc .seta, .pc .alerta, .pc .digita { opacity: 0; }
  .pc.sobre .rosto, .pc.clique .rosto, .pc.parado .rosto { opacity: 0; }
  .pc.sobre .seta { opacity: 1; }
  .pc.clique .alerta { opacity: 1; }
  .pc.clique .seta { opacity: 0; }
  .pc.parado .digita { opacity: 1; }
  .pc .olhos { transform-origin: 23px 17px; animation: piscar 3.6s infinite; }
  .pc .digita rect { animation: pontos 1.1s infinite; }
  .pc .digita rect:nth-child(2) { animation-delay: .15s; } .pc .digita rect:nth-child(3) { animation-delay: .3s; }
  .pc .vento { opacity: 0; transition: opacity .2s; }
  .pc.rapido .vento { opacity: 1; }
  .rastro { display: block; position: fixed; left: 0; top: 0; z-index: 49; width: 6px; height: 6px; background: var(--ink); pointer-events: none; opacity: 0; }
  .rastro.brasa { background: var(--ember); }
}
@keyframes piscar { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes pontos { 0%, 100% { opacity: .25; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pc .olhos, .pc .digita rect { animation: none; } }

    var k2 = reduce ? 1 : 1 - Math.exp(-dt * 5); camP.lerp(alvoP, k2); camL.lerp(alvoL, k2);
    camera.position.copy(camP); camera.lookAt(camL);

    if (!reduce) { var na = neve.geometry.attributes.position.array; for (var q = 1; q < na.length; q += 3) { na[q] -= .012; if (na[q] < 0) na[q] = 24; } neve.geometry.attributes.position.needsUpdate = true; }
    renderer.render(scene, camera);
    requestAnimationFrame(quadro);
  }
  requestAnimationFrame(quadro);
})();
</script>
<script>
(function () {
  if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var pc = document.getElementById('pc'); document.documentElement.classList.add('com-pc');
  var x = innerWidth / 2, y = innerHeight / 2, px = x, py = y, vx = 0, inc = 0, visto = false, ultimoMov = 0, ultimoRastro = 0;
  var pool = [], prox = 0;
  for (var i = 0; i < 40; i++) { var r = document.createElement('div'); r.className = 'rastro' + (i % 7 === 0 ? ' brasa' : ''); document.body.appendChild(r); pool.push({ el: r, x: 0, y: 0, vx: 0, vy: 0, vida: 0, giro: 0 }); }
  function soltar(ax, ay, vx0, vy0) { var b = pool[prox++ % pool.length]; b.x = ax; b.y = ay; b.vx = vx0; b.vy = vy0; b.vida = 1; b.giro = (Math.random() - .5) * 400; }
  addEventListener('pointermove', function (e) {
    if (e.pointerType !== 'mouse') return;
    x = e.clientX; y = e.clientY; ultimoMov = performance.now();
    if (!visto) { px = x; py = y; visto = true; }
    var alvo = e.target.closest && e.target.closest('a, button');
    pc.classList.toggle('sobre', !!alvo);
  });
  addEventListener('pointerdown', function (e) {
    if (e.pointerType !== 'mouse') return;
    pc.classList.add('clique');
    if (!reduce) for (var k = 0; k < 12; k++) { var a = k / 12 * Math.PI * 2; soltar(x + 10, y + 12, Math.cos(a) * (2 + Math.random() * 3), Math.sin(a) * (2 + Math.random() * 3) - 2); }
  });
  addEventListener('pointerup', function () { setTimeout(function () { pc.classList.remove('clique'); }, 260); });
  document.addEventListener('mouseleave', function () { pc.style.opacity = 0; });
  document.addEventListener('mouseenter', function () { pc.style.opacity = 1; });
  (function laco(t) {
    var nx = reduce ? x : px + (x - px) * .22, ny = reduce ? y : py + (y - py) * .22;
    vx = nx - px; px = nx; py = ny;
    inc += ((Math.max(-18, Math.min(18, vx * 1.4))) - inc) * .15;
    var vel = Math.hypot(x - px, y - py);
    pc.classList.toggle('rapido', vel > 30 && !reduce);
    pc.classList.toggle('parado', t - ultimoMov > 4000 && visto);
    pc.style.transform = 'translate(' + px + 'px,' + py + 'px) rotate(' + (reduce ? 0 : inc) + 'deg)';
    if (!reduce && vel > 3 && t - ultimoRastro > 28) { ultimoRastro = t; soltar(px + 14 + (Math.random() - .5) * 10, py + 30, (Math.random() - .5) * 1.2, -Math.random() * .6); }
    pool.forEach(function (b) {
      if (b.vida <= 0) { b.el.style.opacity = 0; return; }
      b.vida -= .022; b.vy += .12; b.x += b.vx; b.y += b.vy;
      b.el.style.opacity = Math.max(0, b.vida);
      b.el.style.transform = 'translate(' + b.x + 'px,' + b.y + 'px) rotate(' + (b.giro * (1 - b.vida)) + 'deg) scale(' + (.4 + b.vida * .8) + ')';
    });
    requestAnimationFrame(laco);
  })(0);
})();
</script>
